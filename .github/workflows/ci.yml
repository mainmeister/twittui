name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system GTK, Xvfb, and Openbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gir1.2-gtk-3.0 \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            shared-mime-info \
            xvfb \
            openbox

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gtk,security,fast-search,xml,dev]"

      - name: Lint with ruff
        run: |
          ruff check twittui main.py twittui_form.py toga_textual_backend.py tiered_search.py double_metaphone.py installer.py generate_icon.py

      - name: Type-check core modules with mypy
        run: |
          mypy twittui/shows.py twittui/cache.py twittui/logging_config.py twittui/rate_limiter.py twittui/resources/__init__.py twittui/cli.py twittui/_compat.py main.py tiered_search.py double_metaphone.py installer.py

      - name: Syntax check all modules
        run: |
          python -m py_compile *.py twittui/*.py twittui/resources/*.py twittui/ui/*.py twittui/search/*.py

      - name: Run headless Textual smoke suite (no DISPLAY)
        env:
          DISPLAY: ""
          TOGA_BACKEND: toga_textual
          SNAP_USER_DATA: ${{ runner.temp }}/twittui_snap_data_textual
        run: |
          mkdir -p "$SNAP_USER_DATA"
          python -W always::ResourceWarning -m unittest test_tui_streaming_and_stdout test_tui_multiselect test_episode_activation test_splash_screen test_architecture_suggestions test_snap -v

      - name: Run full test suite (headless Textual + Xvfb GTK/Openbox)
        env:
          TOGA_BACKEND: toga_textual
          SNAP_USER_DATA: ${{ runner.temp }}/twittui_snap_data
        run: |
          mkdir -p "$SNAP_USER_DATA"
          xvfb-run -a python -W always::ResourceWarning -m unittest discover -s . -p "test_*.py" -v
