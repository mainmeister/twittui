name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system GTK and Xvfb dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gir1.2-gtk-3.0 \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            shared-mime-info \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gtk,security,fast-search,xml,dev]"

      - name: Syntax check all modules
        run: |
          python -m py_compile *.py twittui/*.py twittui/resources/*.py twittui/ui/*.py twittui/search/*.py

      - name: Run full test suite (headless Textual + Xvfb GTK)
        env:
          TOGA_BACKEND: toga_textual
          SNAP_USER_DATA: ${{ runner.temp }}/twittui_snap_data
        run: |
          mkdir -p "$SNAP_USER_DATA"
          xvfb-run -a python -m unittest discover -s . -p "test_*.py" -v
