[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twittui"
version = "1.0.1"
description = "TWiT.tv Terminal & Desktop Media Browser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "toga>=0.4.0",
    "toga-gtk>=0.4.0",
    "toga-textual>=0.4.0",
    "textual>=0.40.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
twittui = "main:main"
